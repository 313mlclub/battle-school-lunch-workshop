services:
  backend:
    build:
      context: ./src/backend
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:?Set NEIS_API_KEY in .env}
      NEIS_BASE_URL: ${NEIS_BASE_URL:-https://open.neis.go.kr/hub}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app

  frontend:
    build:
      context: ./src/frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - app

networks:
  app:
